    <path d="M280 36 h-104 q-10 0 -12 10 l-2 8 q-2 10 6 24 q6 12 26 16 q30 6 58 -4 q24 -8 30 -32 q2 -10 -2 -22 z"/>
    <path d="M136 46 q14 -8 28 0 l-2 8 q-12 -6 -24 0 z"/>
