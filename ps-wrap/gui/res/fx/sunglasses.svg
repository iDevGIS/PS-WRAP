<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 110" width="300" height="110">
  <!-- PS-WRAP facecam effect: classic black wayfarer sunglasses · anchor: lens centers at (72,58) and (228,58) → eye distance 156 -->
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1a" stop-opacity="0.96"/>
      <stop offset="0.55" stop-color="#050505" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#101010" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- temples (ขาแว่น) -->
  <path d="M8 46 L22 40 L22 52 Z" fill="#111"/>
  <path d="M292 46 L278 40 L278 52 Z" fill="#111"/>
